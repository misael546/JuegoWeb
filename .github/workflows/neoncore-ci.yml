name: Neon Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependencies
        working-directory: server
        run: npm install --no-audit --no-fund

      - name: Check server JavaScript syntax
        run: |
          node --check server/server.js
          node --check server/cosmetics.js
          node --check server/storage.js

      - name: Check client JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');

          const html = fs.readFileSync('neoncore/12345/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)]
            .map((m) => m[1])
            .filter((code) => code.trim());

          if (!scripts.length) {
            throw new Error('No JavaScript blocks found in client.');
          }

          for (let i = 0; i < scripts.length; i++) {
            try {
              new vm.Script(scripts[i], { filename: \`client-script-${i + 1}.js\` });
            } catch (error) {
              console.error(error);
              process.exit(1);
            }
          }

          console.log(\`Validated ${scripts.length} client script block(s).\`);
          NODE

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('server/package.json','utf8'))"

