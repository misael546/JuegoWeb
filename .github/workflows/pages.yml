name: Deploy Neon Core to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Neon Core JavaScript
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check requests
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          targets = [
              Path("neoncore/12345/v167/index.html"),
              Path("index.html"),
              Path("neoncore/index.html"),
          ]
          for path in targets:
              html = path.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:[^>]*)>([\s\S]*?)</script>", html, flags=re.I)
              checked = 0
              for i, code in enumerate(scripts):
                  if not code.strip():
                      continue
                  tmp = Path(tempfile.gettempdir()) / f"neoncore_{i}.js"
                  tmp.write_text(code, encoding="utf-8")
                  subprocess.run(["node", "--check", str(tmp)], check=True)
                  checked += 1
              print(f"{path}: {checked} scripts OK")
          PY

      - name: Download Neon Core music pack
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 - <<'PY'
          import html
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import urljoin

          import requests

          PAGE = "https://tinytunatunes.itch.io/free-dark-sci-fi-indie-game-music-pack-5-tracks"
          OUT = Path("neoncore/assets/music")
          OUT.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (GitHub Pages build) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          })
          response = session.get(PAGE, timeout=60)
          response.raise_for_status()
          page = response.text

          hrefs = []
          for m in re.finditer(r'href=[\"\']([^\"\']*/download/[^\"\']*)[\"\']', page, flags=re.I):
              href = html.unescape(m.group(1))
              href = urljoin(PAGE, href)
              if href not in hrefs:
                  hrefs.append(href)

          if len(hrefs) < 5:
              raise SystemExit(
                  f"No se encontraron las 5 descargas de itch.io. Detectadas: {len(hrefs)}. "
                  "La estructura de la pagina puede haber cambiado."
              )

          names = ["exploration","tension","combat","main_menu","bonus"]
          for name, href in zip(names, hrefs[:5]):
              tmp = OUT / f".{name}.wav"
              mp3 = OUT / f"{name}.mp3"
              print(f"[MUSIC] {name}: {href}")
              with session.get(href, stream=True, timeout=180, allow_redirects=True) as r:
                  r.raise_for_status()
                  with tmp.open("wb") as f:
                      for chunk in r.iter_content(chunk_size=1024*1024):
                          if chunk:
                              f.write(chunk)
              if tmp.stat().st_size < 100_000:
                  raise SystemExit(f"Archivo demasiado pequeno para {name}: {tmp.stat().st_size} bytes")
              with tmp.open("rb") as f:
                  magic=f.read(12)
              if not (magic.startswith(b"RIFF") or magic.startswith(b"RIFX")):
                  raise SystemExit(f"La descarga de {name} no parece WAV valido: {magic!r}")
              subprocess.run([
                  "ffmpeg","-y","-loglevel","error",
                  "-i",str(tmp),
                  "-codec:a","libmp3lame","-b:a","96k",
                  str(mp3)
              ], check=True)
              tmp.unlink(missing_ok=True)
              print(f"[MUSIC] listo {mp3} ({mp3.stat().st_size} bytes)")

          (OUT / "CREDIT.txt").write_text(
              "Neon Core usa musica del pack Free Dark Sci-Fi Indie Game Music Pack (5 Tracks)\n"
              "Music by tinytunatunes | https://tinytunatunes.itch.io/\n"
              "Uso permitido en proyectos personales y comerciales; se permite editar, hacer loop, remix y adaptar.\n"
              "No redistribuir ni sublicenciar los archivos de audio como archivos independientes o como otro asset pack.\n",
              encoding="utf-8"
          )
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
