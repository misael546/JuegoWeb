name: Deploy Neon Core to GitHub Pages
# Force Pages refresh from current main branch — 20261003-007

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Neon Core JavaScript
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check requests
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          targets = [
              Path("neoncore/12345/v167/index.html"),
              Path("index.html"),
              Path("neoncore/index.html"),
          ]
          for path in targets:
              html = path.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:[^>]*)>([\s\S]*?)</script>", html, flags=re.I)
              checked = 0
              for i, code in enumerate(scripts):
                  if not code.strip():
                      continue
                  tmp = Path(tempfile.gettempdir()) / f"neoncore_{i}.js"
                  tmp.write_text(code, encoding="utf-8")
                  subprocess.run(["node", "--check", str(tmp)], check=True)
                  checked += 1
              print(f"{path}: {checked} scripts OK")
          PY

      - name: Verify official entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("index.html").read_text(encoding="utf-8")
          legacy = Path("neoncore/index.html").read_text(encoding="utf-8")

          assert '20261003-006-pages-live-main-menu' in root
          assert 'const PUBLIC_ROOM_CODE=""' in root
          assert 'MENÚ PRINCIPAL · SALAS PÚBLICAS' not in root
          assert 'Sala #1' not in root
          assert '20261003-167-darkscifi' not in root
          assert 'location.replace(target+q)' in legacy

          print("[PAGES] Official root verified: current main menu.")
          print("[PAGES] Legacy neoncore route redirects to official root.")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
