name: Neon Core validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install server dependencies
        run: npm install
      - name: Check server syntax
        run: node --check server.js
      - name: Check storage syntax
        run: node --check storage.js
      - name: Check Neon Core client syntax
        working-directory: .
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = [
            'neoncore/12345/index.html',
            'neoncore/67890/index.html'
          ];
          for (const file of files) {
            const html = fs.readFileSync(file, 'utf8');
            const matches = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            if (!matches.length) throw new Error(file + ': no inline script found');
            new Function(matches[matches.length - 1][1]);
            console.log(file + ': OK');
          }
          NODE

      - name: Verify build synchronization and removed legacy bank UI
        working-directory: .
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const files = ['server/server.js','neoncore/12345/index.html','neoncore/67890/index.html','neoncore/index.html'];
          const texts = files.map(f => fs.readFileSync(f,'utf8'));
          const versions = [];
          const server = texts[0].match(/SERVER_VERSION\\s*=\\s*['"]([^'"]+)/);
          if (server) versions.push(server[1]);
          for (const html of texts.slice(1,3)) {
            const m = html.match(/var\\s+v\\s*=\\s*["']([^"']+)["']/);
            if (!m) throw new Error('Client build marker missing');
            versions.push(m[1]);
          }
          if (new Set(versions).size !== 1 || versions[0] !== '20261001-101') throw new Error('Build mismatch: ' + versions.join(', '));
          for (const [i, html] of texts.slice(1,3).entries()) {
            if (/bankedGold|bankedDiamonds|BANK_NPC|SAVE_NPC/i.test(html)) throw new Error(files[i+1] + ': legacy bank/save UI reference found');
          }
          console.log('Build synchronization: OK');
          NODE
