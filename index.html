<script>
(function(){
  try{
    var v="20261001-25";
    var k="neon_core_build";
    window.NEON_CORE_BUILD=v;
    var old=localStorage.getItem(k);
    if(old!==v) localStorage.setItem(k,v);
    window.setTimeout(function(){
      fetch(location.pathname+"?update_check="+Date.now(),{
        cache:"no-store",
        headers:{"Cache-Control":"no-cache"}
      }).then(function(r){return r.text();}).then(function(html){
        var m=html.match(/window\.NEON_CORE_BUILD\s*=\s*"([^"]+)"/);
        if(m && m[1]!==window.NEON_CORE_BUILD) location.reload();
      }).catch(function(){});
    },1500);
  }catch(e){}
})();
</script>

<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

const world={w:3000,h:2200};
const p={x:1500,y:1100,r:24,angle:0,hp:100,maxHp:100,xp:0,level:1,score:0,kills:0,pvpKills:0,damage:25,defense:0,speed:205,fireRate:280,lastShot:0,alive:true};
let bullets=[],enemies=[],drops=[],particles=[],walls=[];
let serverXpNeed=100,serverKillsToLevel=5;
let gameActive=false;
let camera={x:p.x,y:p.y},last=performance.now(),playerName="";
const keys={w:false,a:false,s:false,d:false};
const pointer={x:W/2,y:H/2,down:false};
let moveX=0,moveY=0;
let controlMode="touch";
function updateControlMode(){
  controlMode=("ontouchstart" in window || navigator.maxTouchPoints>0)?"touch":"mouse";
}
updateControlMode();
const remotePlayers=new Map();
let multiplayerSocket=null,multiplayerId="",lastNetSend=0,currentRoom="";
const MULTIPLAYER_SERVER=localStorage.getItem("neon_core_server_url")||"wss://neon-core-multiplayer.onrender.com/ws";
function renderPlayers(list){
  const panel=document.getElementById("playersPanel"),count=document.getElementById("playersCount"),box=document.getElementById("playersList");
  const players=Array.isArray(list)?list:[];
  count.textContent=players.length;
  box.innerHTML="";
  for(const q of players){
    const row=document.createElement("div");
    row.className="onlinePlayer";
    const name=document.createElement("span");
    name.textContent=q.id===multiplayerId?(q.name||"Jugador")+" (TÚ)":(q.name||"Jugador");
    const state=document.createElement("small");
    state.textContent=q.alive===false?"DESTRUIDO":"ONLINE";
    row.append(name,state);box.appendChild(row);
  }
  panel.style.display=currentRoom?"block":"none";
}
function updatePlayersFromList(list){
  remotePlayers.clear();
  for(const q of (list||[])) if(q.id!==multiplayerId) remotePlayers.set(q.id,q);
  renderPlayers(list||[]);
}
function setConnectionStatus(title,text,show=true){
  const overlay=document.getElementById("connectionOverlay"),t=document.getElementById("connectionTitle"),d=document.getElementById("connectionText");
  if(t)t.textContent=title||"CONECTANDO AL SERVIDOR";if(d)d.textContent=text||"";if(overlay)overlay.style.display=show?"flex":"none";
}
function connectMultiplayer(roomMode="quick",roomCode=""){
  currentRoom=roomMode==="quick"?"OPEN":(roomCode||"PRIVATE");
  setConnectionStatus("CONECTANDO AL SERVIDOR","Despertando el servidor multiplayer…");
  if(multiplayerSocket && multiplayerSocket.readyState<=1) multiplayerSocket.close();

  if(!MULTIPLAYER_SERVER || !("WebSocket" in window)){setConnectionStatus("SERVIDOR NO DISPONIBLE","Tu navegador no permite conexión multiplayer.",true);return;}
  try{
    multiplayerSocket=new WebSocket(MULTIPLAYER_SERVER);
    multiplayerSocket.addEventListener("open",()=>{
      setConnectionStatus("CONECTADO","Entrando a la sala…");
      multiplayerSocket.send(JSON.stringify({type:"join",name:playerName||"Jugador",saveKey:saveKey,color:"#39e7ff",room:roomMode==="join"?roomCode:"",createRoom:roomMode==="create"}));
    });
    multiplayerSocket.addEventListener("message",e=>{
      try{
        const m=JSON.parse(e.data);
        if(m.type==="save_ok"){
          savedFrozen=true;gameActive=false;resetAllControls();
          saveGameBtn.textContent="GUARDADO";
          resumeGameBtn.style.display="block";
          saveGameBtn.disabled=true;
        }else if(m.type==="resume_ok"){
          savedFrozen=false;gameActive=true;
          saveGameBtn.textContent="GUARDAR";
          saveGameBtn.disabled=false;
          resumeGameBtn.style.display="none";
        }else if(m.type==="room_joined"){
          setConnectionStatus("CONECTADO","Listo. Entrando a la arena…",false);
          const me=(m.players||[]).find(q=>q.id===multiplayerId);
          if(me){
            p.x=me.x;p.y=me.y;p.hp=Number.isFinite(me.hp)?me.hp:p.maxHp;p.alive=me.alive!==false;
            if(Number.isFinite(me.level))p.level=me.level;
            if(Number.isFinite(me.score))p.score=me.score;
            if(Number.isFinite(me.kills))p.kills=me.kills;
            if(Number.isFinite(me.pvpKills))p.pvpKills=me.pvpKills;
            if(Number.isFinite(me.xp))p.xp=me.xp;
            if(Number.isFinite(me.damage))p.damage=me.damage;
            if(Number.isFinite(me.fireRate))p.fireRate=me.fireRate;
            if(Number.isFinite(me.defense))p.defense=me.defense;
            p.maxHp=100+(p.level-1)*15;
            p.speed=205+(p.level-1)*4;
          }
          enemies.length=0;
          for(const e of (m.enemies||[])){e.targetX=e.x;e.targetY=e.y;e.shape=e.shape||"triangle";enemies.push(e);}
          gameActive=true;
          nameBox.style.display="none";
          updatePlayersFromList(m.players||[]);
        }else if(m.type==="room_error"){
          const msg=document.getElementById("nameMsg"); if(msg)msg.textContent=m.message||"No se pudo entrar a la sala.";
          nameBox.style.display="flex";
        }else if(m.type==="connected"){
          multiplayerId=m.id;
        }else if(m.type==="player_list"){
          const me=(m.players||[]).find(q=>q.id===multiplayerId);
          if(me){
            if(Number.isFinite(me.level))p.level=me.level;
            if(Number.isFinite(me.score))p.score=me.score;
            if(Number.isFinite(me.kills))p.kills=me.kills;
            if(Number.isFinite(me.pvpKills))p.pvpKills=me.pvpKills;
            if(Number.isFinite(me.xp))p.xp=me.xp;
            if(Number.isFinite(me.damage))p.damage=me.damage;
            if(Number.isFinite(me.defense))p.defense=me.defense;
            if(Number.isFinite(me.fireRate))p.fireRate=me.fireRate;
            p.maxHp=100+(p.level-1)*15;
            p.speed=205+(p.level-1)*4;
          }
          updatePlayersFromList(m.players||[]);
        }else if(m.type==="welcome"){
          multiplayerId=m.id;
          remotePlayers.clear();
          for(const q of (m.players||[])) if(q.id!==multiplayerId){q.targetX=q.x;q.targetY=q.y;q.targetAngle=q.angle;q.targetHp=q.hp;q.targetAlive=q.alive;remotePlayers.set(q.id,q);}
          renderPlayers(m.players||[]);
        }else if(m.type==="player_join"||m.type==="player_update"){
          if(m.player && m.player.id!==multiplayerId){
            const old=remotePlayers.get(m.player.id);
            if(old){
              old.targetX=m.player.x;old.targetY=m.player.y;old.targetAngle=m.player.angle;
              old.targetHp=m.player.hp;old.targetAlive=m.player.alive;
              old.name=m.player.name;old.level=m.player.level;old.score=m.player.score;old.kills=m.player.kills;old.color=m.player.color;
            }else{
              m.player.targetX=m.player.x;m.player.targetY=m.player.y;m.player.targetAngle=m.player.angle;
              m.player.targetHp=m.player.hp;m.player.targetAlive=m.player.alive;
              remotePlayers.set(m.player.id,m.player);
            }
          }
        }else if(m.type==="enemy_state"){
          const incoming=m.enemies||[];
          const byId=new Map(enemies.map(e=>[e.id,e]));
          const next=[];
          for(const e of incoming){
            const old=byId.get(e.id);
            if(old){
              old.lastTargetX=old.targetX;old.lastTargetY=old.targetY;old.targetX=e.x;old.targetY=e.y;old.vx=Number.isFinite(e.vx)?e.vx:(e.x-old.lastTargetX)/0.05;old.vy=Number.isFinite(e.vy)?e.vy:(e.y-old.lastTargetY)/0.05;old.hp=e.hp;old.maxHp=e.maxHp;old.r=e.r;old.kind=e.kind;old.shape=e.shape||old.shape;old.speed=e.speed;old.damage=e.damage;
              old.dead=false;next.push(old);
            }else{
              e.targetX=e.x;e.targetY=e.y;e.lastTargetX=e.x;e.lastTargetY=e.y;e.vx=Number(e.vx)||0;e.vy=Number(e.vy)||0;e.shape=e.shape||"triangle";next.push(e);
            }
          }
          enemies.length=0;
          for(const e of next) enemies.push(e);
        }else if(m.type==="enemy_hit"){
          const e=enemies.find(x=>x.id===m.id);
          if(e){
            e.hp=m.hp;
            if(Number(m.hp)<=0)enemyExplosion(e);
          }
        }else if(m.type==="enemy_dead"){
          const e=enemies.find(x=>x.id===m.id);
          if(e)enemyExplosion(e);
        }else if(m.type==="pve_damage"){
          p.hp=Math.max(0,p.hp-(Number(m.amount)||0));
          burst(p.x,p.y,"#ff5474",4);
        }else if(m.type==="pve_dead"){
          const lostScore=p.score;p.hp=0;p.alive=false;resetProgressOnDeath();
          
          gameActive=false;enemies.length=0;setTimeout(returnToMenu,50);
        }else if(m.type==="pvp_damage"){
          p.hp=Math.max(0,p.hp-(Number(m.amount)||0));
          burst(p.x,p.y,"#ff5474",8);
        }else if(m.type==="pvp_dead"){
          const lostScore=p.score;p.hp=0;p.alive=false;resetProgressOnDeath();
          
          gameActive=false;
          enemies.length=0;
          setTimeout(returnToMenu,50);
        }else if(m.type==="server_stats"){
          if(Number.isFinite(m.kills))p.kills=m.kills;
          if(Number.isFinite(m.pvpKills))p.pvpKills=m.pvpKills;
          if(Number.isFinite(m.score))p.score=m.score;
          if(Number.isFinite(m.xp))p.xp=m.xp;
          if(Number.isFinite(m.level))p.level=m.level;
          if(Number.isFinite(m.damage))p.damage=m.damage;
          if(Number.isFinite(m.defense))p.defense=m.defense;
          if(Number.isFinite(m.fireRate))p.fireRate=m.fireRate;
          if(Number.isFinite(m.maxHp))p.maxHp=m.maxHp;
          if(Number.isFinite(m.xpNeed))serverXpNeed=m.xpNeed;
          if(Number.isFinite(m.killsToLevel))serverKillsToLevel=m.killsToLevel;
        }else if(m.type==="respawn_ok"){
          p.x=m.x;p.y=m.y;p.hp=p.maxHp;p.alive=true;
          document.getElementById("death").style.display="none";
        }else if(m.type==="player_leave"){
          remotePlayers.delete(m.id);
        }
      }catch{}
    });
    multiplayerSocket.addEventListener("error",()=>{
      setConnectionStatus("ESPERANDO AL SERVIDOR","El servidor gratuito puede estar despertando. Reintentando…");
      nameBox.style.display="flex";
      username.value=playerName||username.value;
    });
    multiplayerSocket.addEventListener("close",()=>{
      multiplayerSocket=null;
      if(!gameActive && currentRoom){
        setConnectionStatus("SERVIDOR EN ESPERA","No se pudo completar la conexión. Pulsa ENTRAR RÁPIDO otra vez.");
        nameBox.style.display="flex";
        username.value=playerName||username.value;
      }else if(currentRoom){
        setConnectionStatus("SERVIDOR EN ESPERA","El servidor se desconectó. Recarga para volver a conectar.");
      }
    });
  }catch{}
}
function sendMultiplayerState(dt){
  if(!multiplayerSocket || multiplayerSocket.readyState!==1)return;
  lastNetSend+=dt;
  if(lastNetSend<.05)return;
  lastNetSend=0;
  multiplayerSocket.send(JSON.stringify({type:"state",x:p.x,y:p.y,angle:p.angle}));
}

function rand(a,b){return a+Math.random()*(b-a)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function saveName(n){try{localStorage.setItem("neon_core_name",n)}catch(e){}}
function loadName(){try{return localStorage.getItem("neon_core_name")||""}catch(e){return""}}
function saveStats(){}
function loadStats(){}

function spawnEnemy(){return null;}

for(let i=0;i<55;i++){
  walls.push({x:rand(120,world.w-120),y:rand(120,world.h-120),w:rand(45,130),h:rand(45,130),hp:100,maxHp:100});
}

function burst(x,y,color,n=10){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=rand(90,260);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.35,.8),maxLife:.8,color,size:rand(3,7)});
  }
  particles.push({x,y,vx:0,vy:0,life:.38,maxLife:.38,color,size:18,ring:true});
  particles.push({x,y,vx:0,vy:0,life:.22,maxLife:.22,color,size:8,ring:true});
}
function enemyExplosion(e){
  if(!e || e.dead)return;
  burst(e.x,e.y,e.kind==="elite"?"#ff9f43":"#ff3b81",26);
  e.dead=true;
}

function fire(){
  if(!p.alive)return;
  const now=performance.now();
  if(now-p.lastShot<p.fireRate)return;
  p.lastShot=now;
  if(multiplayerSocket && multiplayerSocket.readyState===1){
    multiplayerSocket.send(JSON.stringify({type:"fire"}));
  }
  bullets.push({x:p.x+Math.cos(p.angle)*30,y:p.y+Math.sin(p.angle)*30,vx:Math.cos(p.angle)*650,vy:Math.sin(p.angle)*650,life:1.5,damage:p.damage,range:0});
}
function resetProgressOnDeath(){
  p.level=1;
  p.maxHp=100;
  p.hp=0;
  p.damage=25;
  p.speed=205;
  p.fireRate=280;
  p.xp=0;
  p.score=0;
  p.kills=0;
  p.pvpKills=0;
  saveStats();
}
function returnToMenu(){
  gameActive=false;
  enemies.length=0;
  document.getElementById("death").style.display="none";
  document.getElementById("nameBox").style.display="flex";
  document.getElementById("nameMsg").textContent="";
  document.getElementById("playersPanel").style.display="none";
  document.getElementById("upgrade").style.display="none";
  currentRoom="";
  remotePlayers.clear();
  if(multiplayerSocket){
    try{multiplayerSocket.close()}catch{}
    multiplayerSocket=null;
  }
  p.x=1500;p.y=1100;p.hp=p.maxHp;p.alive=true;
  bullets.length=0;
  resetAllControls();
  username.value=loadName();
  username.focus();
}
function damagePlayer(amount){
  if(!p.alive)return;
  p.hp-=amount;burst(p.x,p.y,"#ff5474",4);
  if(p.hp<=0){
    const lostScore=p.score;
    p.hp=0;p.alive=false;
    resetProgressOnDeath();
    document.getElementById("deathScore").textContent=lostScore;
    gameActive=false;
    enemies.length=0;
    setTimeout(returnToMenu,50);
  }
}
function levelCheck(){ return false; }
function hitWall(b){
  for(const w of walls){
    if(b.x>w.x-w.w/2&&b.x<w.x+w.w/2&&b.y>w.y-w.h/2&&b.y<w.y+w.h/2){
      w.hp-=b.damage*.8;burst(b.x,b.y,"#7d8ba3",3);
      if(w.hp<=0){w.dead=true;burst(w.x,w.y,"#39e7ff",15)}
      return true;
    }
  }
  return false;
}

function update(dt){
  if(!gameActive)return;
  if(!p.alive){sendMultiplayerState(dt);return;}
  let mx=(keys.d?1:0)-(keys.a?1:0),my=(keys.s?1:0)-(keys.w?1:0);
  if(Math.hypot(moveX,moveY)>.1){mx=moveX;my=moveY}
  const ml=Math.hypot(mx,my);
  if(ml>.1){
    const nx=mx/ml,ny=my/ml;
    p.angle=Math.atan2(ny,nx);
    p.x+=nx*p.speed*Math.min(1,ml)*dt;
    p.y+=ny*p.speed*Math.min(1,ml)*dt;
  }
  p.x=clamp(p.x,35,world.w-35);p.y=clamp(p.y,35,world.h-35);

  if(controlMode==="mouse" && ml<=.1)p.angle=Math.atan2(pointer.y-H/2,pointer.x-W/2);

  if(pointer.down)fire();

  for(const b of bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;b.range+=650*dt;
    if(b.life<=0||b.range>1000||b.x<0||b.y<0||b.x>world.w||b.y>world.h||hitWall(b))b.dead=true;
  }

  for(const q of particles){
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;q.life-=dt;
  }
  bullets=bullets.filter(x=>!x.dead);enemies=enemies.filter(x=>!x.dead);particles=particles.filter(x=>x.life>0);walls=walls.filter(x=>!x.dead);

  camera.x+=(p.x-camera.x)*Math.min(1,dt*7);camera.y+=(p.y-camera.y)*Math.min(1,dt*7);
  sendMultiplayerState(dt);
}

function sx(x){return x-camera.x+W/2}
function sy(y){return y-camera.y+H/2}

function drawTank(x,y,angle,color="#39e7ff",r=24){
  ctx.save();ctx.translate(sx(x),sy(y));ctx.rotate(angle);
  ctx.fillStyle="#09111f";ctx.beginPath();ctx.arc(0,0,r+3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#142238";ctx.fillRect(3,-7,r+16,14);
  ctx.fillStyle="#dffbff";ctx.fillRect(r+7,-3,12,6);
  ctx.restore();
}
function drawEnemy(e){
  const color=e.kind==="elite"?"#ff9f43":"#ff3b81";
  const r=e.r;
  // La forma se decide al crear el enemigo, no por la zona del mapa.
  const shape=e.shape||"triangle";
  ctx.save();
  ctx.translate(sx(e.x),sy(e.y));
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();ctx.arc(3,5,r+3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=color;
  ctx.strokeStyle=e.kind==="elite"?"#ffd08a":"#ff9fba";
  ctx.lineWidth=3;
  ctx.beginPath();
  if(shape==="square"){
    ctx.rect(-r,-r,r*2,r*2);
  }else if(shape==="triangle"){
    ctx.moveTo(0,-r*1.15);
    ctx.lineTo(r*1.05,r*.9);
    ctx.lineTo(-r*1.05,r*.9);
    ctx.closePath();
  }else{
    for(let i=0;i<6;i++){
      const a=-Math.PI/2+i*Math.PI/3;
      const px=Math.cos(a)*r,py=Math.sin(a)*r;
      if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();
  }
  ctx.fill();ctx.stroke();
  // Núcleo simple: sin torreta, cañón ni piezas de tanque.
  ctx.fillStyle="#0b1020";
  ctx.beginPath();ctx.arc(0,0,r*.22,0,Math.PI*2);ctx.fill();
  if(e.kind==="elite"){
    ctx.strokeStyle="#fff0c2";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,r*.62,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}
function drawNameTag(name,x,y,r,color="#ffffff"){
  const tx=sx(x),ty=sy(y)-r-18;
  ctx.save();
  ctx.font="bold 13px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  const pad=7,w=ctx.measureText(name).width+pad*2;
  ctx.fillStyle="rgba(3,8,18,.78)";
  ctx.fillRect(tx-w/2,ty-10,w,20);
  ctx.strokeStyle=color;
  ctx.globalAlpha=.65;
  ctx.strokeRect(tx-w/2,ty-10,w,20);
  ctx.globalAlpha=1;
  ctx.fillStyle=color;
  ctx.fillText(name,tx,ty);
  ctx.restore();
}

function smoothRemotePlayers(dt){
  const t=Math.min(1,dt*14);
  for(const other of remotePlayers.values()){
    if(!Number.isFinite(other.targetX))continue;
    other.x+=(other.targetX-other.x)*t;
    other.y+=(other.targetY-other.y)*t;
    let da=other.targetAngle-other.angle;
    da=Math.atan2(Math.sin(da),Math.cos(da));
    other.angle+=da*t;
    other.hp=Number.isFinite(other.targetHp)?other.targetHp:other.hp;
    other.alive=other.targetAlive!==false;
  }
}
function smoothEnemies(dt){
  for(const e of enemies){
    if(!Number.isFinite(e.targetX))continue;
    const vx=Number.isFinite(e.vx)?Math.max(-100,Math.min(100,e.vx)):0;
    const vy=Number.isFinite(e.vy)?Math.max(-100,Math.min(100,e.vy)):0;
    e.x+=vx*dt;
    e.y+=vy*dt;
    const errorX=e.targetX-e.x;
    const errorY=e.targetY-e.y;
    const correction=Math.min(1,dt*5);
    e.x+=errorX*correction;
    e.y+=errorY*correction;
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#070b13";ctx.fillRect(0,0,W,H);

  const grid=80,ox=((W/2-camera.x)%grid+grid)%grid,oy=((H/2-camera.y)%grid+grid)%grid;
  ctx.strokeStyle="#101b2b";ctx.lineWidth=1;
  for(let x=ox;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=oy;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  ctx.strokeStyle="#26344e";ctx.strokeRect(sx(0),sy(0),world.w,world.h);

  for(const w of walls){
    const x=sx(w.x-w.w/2),y=sy(w.y-w.h/2);
    ctx.fillStyle="#182438";ctx.fillRect(x,y,w.w,w.h);
    ctx.strokeStyle="#344865";ctx.strokeRect(x,y,w.w,w.h);
    ctx.fillStyle="#39e7ff";ctx.globalAlpha=.15;ctx.fillRect(x,y,w.w*(w.hp/w.maxHp),4);ctx.globalAlpha=1;
  }

  for(const b of bullets){ctx.fillStyle="#dffbff";ctx.beginPath();ctx.arc(sx(b.x),sy(b.y),4,0,Math.PI*2);ctx.fill()}
  for(const other of remotePlayers.values()){
    drawTank(other.x,other.y,other.angle,"#7cff72",24);
    drawNameTag(other.name||"Jugador",other.x,other.y,24,"#7cff72");
    const ox=sx(other.x),oy=sy(other.y)-31;
    ctx.fillStyle="#101827";ctx.fillRect(ox-24,oy,48,4);
    ctx.fillStyle="#7cff72";ctx.fillRect(ox-24,oy,48*clamp((other.hp||100)/100,0,1),4);
  }
  for(const e of enemies){
    const enemyAngle=Math.atan2(p.y-e.y,p.x-e.x);
    drawEnemy(e);
    drawNameTag(e.kind==="elite"?"ÉLITE":"ENEMIGO",e.x,e.y,e.r,e.kind==="elite"?"#ff9f43":"#ff5474");
    const x=sx(e.x),y=sy(e.y)-e.r-10;ctx.fillStyle="#161c2a";ctx.fillRect(x-25,y,50,5);ctx.fillStyle=e.kind==="elite"?"#ff9f43":"#ff5474";ctx.fillRect(x-25,y,50*(e.hp/e.maxHp),5);
  }
  for(const q of particles){
    const alpha=Math.max(0,q.life/(q.maxLife||.6));
    ctx.globalAlpha=alpha;
    ctx.fillStyle=q.color;
    if(q.ring){
      const progress=1-alpha;
      ctx.strokeStyle=q.color;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(sx(q.x),sy(q.y),q.size*(1+progress*2.8),0,Math.PI*2);ctx.stroke();
    }else{
      ctx.beginPath();ctx.arc(sx(q.x),sy(q.y),q.size||3,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  drawTank(p.x,p.y,p.angle);
  drawNameTag(playerName,p.x,p.y,p.r,"#39e7ff");

  document.getElementById("hp").textContent=Math.ceil(p.hp);
  document.getElementById("maxHp").textContent=p.maxHp;
  document.getElementById("level").textContent="Nv. "+p.level;
  document.getElementById("pvpKills").textContent=p.pvpKills;
  document.getElementById("kills").textContent=p.kills;
  document.getElementById("damageStat").textContent=p.damage;
  document.getElementById("defenseStat").textContent=p.defense;
  const need=Math.max(1,serverXpNeed);
  document.getElementById("xp").textContent=p.xp;document.getElementById("xpNeed").textContent=need;
  document.getElementById("hpFill").style.width=clamp(p.hp/p.maxHp*100,0,100)+"%";
  document.getElementById("xpFill").style.width=clamp(p.xp/need*100,0,100)+"%";
}

function setupJoystick(id){
  const el=document.getElementById(id),stick=el.querySelector(".stick");
  let active=false,pointerId=null;
  function reset(){
    active=false;pointerId=null;
    stick.style.transform="translate(0,0)";
    moveX=0;moveY=0;
  }
  function set(e){
    const r=el.getBoundingClientRect();
    const cx=r.left+r.width/2,cy=r.top+r.height/2;
    const max=Math.max(1,(r.width-stick.offsetWidth)/2);
    let x=e.clientX-cx,y=e.clientY-cy;
    const len=Math.hypot(x,y);
    if(len>max){x=x/len*max;y=y/len*max}
    stick.style.transform="translate("+x+"px,"+y+"px)";
    moveX=clamp(x/max,-1,1);
    moveY=clamp(y/max,-1,1);
  }
  el.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse" && e.button!==0)return;
    e.preventDefault();
    reset();
    active=true;pointerId=e.pointerId;
    try{el.setPointerCapture(pointerId)}catch{}
    set(e);
  },{passive:false});
  el.addEventListener("pointermove",e=>{
    if(active && e.pointerId===pointerId){
      e.preventDefault();set(e);
    }
  },{passive:false});
  const finish=e=>{
    if(pointerId===null || e.pointerId===pointerId){e.preventDefault();reset()}
  };
  el.addEventListener("pointerup",finish,{passive:false});
  el.addEventListener("pointercancel",finish,{passive:false});
  el.addEventListener("lostpointercapture",()=>reset());
  return reset;
}
const resetMoveJoystick=setupJoystick("moveJoy");

function resetAllControls(){
  resetMoveJoystick();
  pointer.down=false;
}
addEventListener("resize",resetAllControls);
addEventListener("orientationchange",resetAllControls);
addEventListener("blur",resetAllControls);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)resetAllControls();
});

const nameBox=document.getElementById("nameBox");
const nameForm=document.getElementById("nameForm");
const username=document.getElementById("username");
const nameMsg=document.getElementById("nameMsg");
const createRoomBtn=document.getElementById("createRoom");
const joinRoomBtn=document.getElementById("joinRoom");
const roomCodeInput=document.getElementById("roomCodeInput");

const restartBtn=document.getElementById("restart");
const saveGameBtn=document.getElementById("saveGame");
const resumeGameBtn=document.getElementById("resumeGame");
saveGameBtn.addEventListener("click",()=>{
  if(!multiplayerSocket||multiplayerSocket.readyState!==1||!currentRoom||!p.alive)return;
  resetAllControls();
  gameActive=false;
  savedFrozen=true;
  multiplayerSocket.send(JSON.stringify({type:"save",x:p.x,y:p.y,angle:p.angle,hp:p.hp}));
});
resumeGameBtn.addEventListener("click",()=>{
  if(!multiplayerSocket||multiplayerSocket.readyState!==1||!currentRoom)return;
  multiplayerSocket.send(JSON.stringify({type:"resume"}));
});
let savedFrozen=false;
let saveKey="";
try{saveKey=localStorage.getItem("neon_core_save_key")||"";if(!saveKey){saveKey="p_"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("neon_core_save_key",saveKey);}}catch(e){saveKey="guest_"+Math.random().toString(36).slice(2)}

function startGame(mode="quick",code=""){
  const n=String(username.value||"").trim().slice(0,20);
  if(!n){
    nameMsg.textContent="Escribe un nombre para entrar.";
    username.focus();
    return;
  }
  playerName=n;
  saveName(n);
  gameActive=false;
  savedFrozen=false;
  enemies.length=0;
  nameMsg.textContent="";
  nameBox.style.display="flex";
  connectMultiplayer(mode,code);
}

nameForm.addEventListener("submit",e=>{
  e.preventDefault();
  startGame("quick","");
});

createRoomBtn.addEventListener("click",()=>{
  const n=String(username.value||"").trim();
  if(!n){nameMsg.textContent="Escribe un nombre primero.";username.focus();return;}
  startGame("create","");
});

joinRoomBtn.addEventListener("click",()=>{
  const n=String(username.value||"").trim();
  const code=String(roomCodeInput.value||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);
  roomCodeInput.value=code;
  if(!n){nameMsg.textContent="Escribe un nombre primero.";username.focus();return;}
  if(code.length!==4){nameMsg.textContent="El código debe tener 4 caracteres.";roomCodeInput.focus();return;}
  startGame("join",code);
});

roomCodeInput.addEventListener("input",()=>{
  roomCodeInput.value=roomCodeInput.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);
});

restartBtn.addEventListener("click",()=>returnToMenu());


username.value=loadName();
username.addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();startGame("quick","");}
});

addEventListener("keydown",e=>{
  if(e.target===username||e.target===roomCodeInput)return;
  const k=e.key.toLowerCase();
  if(k==="w")keys.w=true;
  if(k==="a")keys.a=true;
  if(k==="s")keys.s=true;
  if(k==="d")keys.d=true;
  if(e.code==="Space"){e.preventDefault();pointer.down=true;fire();}
});
addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(k==="w")keys.w=false;
  if(k==="a")keys.a=false;
  if(k==="s")keys.s=false;
  if(k==="d")keys.d=false;
  if(e.code==="Space")pointer.down=false;
});

canvas.addEventListener("pointermove",e=>{
  if(e.pointerType==="mouse"){pointer.x=e.clientX;pointer.y=e.clientY;}
});
canvas.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"){
    pointer.x=e.clientX;pointer.y=e.clientY;pointer.down=true;fire();
  }
});
addEventListener("pointerup",e=>{if(e.pointerType==="mouse")pointer.down=false;});

const fireButton=document.getElementById("fire");
fireButton.addEventListener("pointerdown",e=>{e.preventDefault();pointer.down=true;fire();},{passive:false});
fireButton.addEventListener("pointerup",e=>{e.preventDefault();pointer.down=false;},{passive:false});
fireButton.addEventListener("pointercancel",()=>{pointer.down=false;});
fireButton.addEventListener("lostpointercapture",()=>{pointer.down=false;});

loadStats();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);
  last=now;
  update(dt);
  smoothRemotePlayers(dt);
  smoothEnemies(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
